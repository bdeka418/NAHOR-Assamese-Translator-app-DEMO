<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="description" content="Nahor translates Word documents from English to Assamese, keeping the layout, pictures and your own glossary terms." />
    <meta name="theme-color" content="#091315" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // apply the saved theme before the first paint so the page never flashes the wrong colours
      try {
        var t = localStorage.getItem('theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var a = localStorage.getItem('accent');
        document.documentElement.dataset.accent = ['river', 'muga', 'gamosa', 'dihing'].indexOf(a) > -1 ? a : 'river';
        document.documentElement.dataset.size = localStorage.getItem('size') || 'normal';
        document.documentElement.dataset.motion = localStorage.getItem('motion') || 'smooth';
      } catch (e) {}
    </script>
    <title>Nahor - English to Assamese document translator</title>
    <script type="module" crossorigin src="./assets/index-DFlV2537.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CvJxsjWJ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
